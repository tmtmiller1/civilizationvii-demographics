<div class="dgh-root w-full h-full flex items-center justify-center">
    <fxs-frame frame-style="f2" class="dgh-frame relative flex flex-col">
        <div class="dgh-titlerow relative flex flex-col">
            <fxs-header class="dgh-title relative font-title text-xl uppercase text-secondary"
                        filigree-style="h4" title="LOC_DEMOGRAPHICS_HIST_TITLE"></fxs-header>
            <!-- The short-games filter is mounted here (view-hof.js): it qualifies every section,
                 so it belongs on the screen's own title line rather than on the section tab bar,
                 whose frame it overlapped. -->
            <div class="dgh-title-slot"></div>
        </div>
        <div class="dgh-body relative flex flex-col flex-auto px-6 pb-6">
            <div class="dgh-screen-host w-full flex flex-col flex-auto"></div>
        </div>
        <fxs-close-button data-dgh-close
            data-audio-group-ref="audio-screen-unlocks"
            data-audio-activate-ref="data-audio-close-selected"
            data-audio-press-ref="data-audio-close-press"></fxs-close-button>
    </fxs-frame>
</div>
